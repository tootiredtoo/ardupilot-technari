name: Build & Test

on:
  # Run automatically on every PR and every push to a PR branch
  pull_request:
    types: [opened, synchronize, reopened]

  # Manual trigger — lets you run tests on any branch without a PR
  workflow_dispatch:

jobs:
  # ── Job 1: Build Pixhawk6X firmware ──────────────────────────────────────
  build-pixhawk6x:
    name: Build ArduPlane — Pixhawk6X
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi
          pip install empy==3.3.4

      - name: Configure waf for Pixhawk6X
        run: python3 waf configure --board Pixhawk6X

      - name: Build ArduPlane Pixhawk6X
        run: python3 waf --targets bin/arduplane

      - name: Upload Pixhawk6X firmware
        uses: actions/upload-artifact@v4
        with:
          name: arduplane-Pixhawk6X-${{ github.sha }}
          path: |
            build/Pixhawk6X/bin/arduplane.apj
            build/Pixhawk6X/bin/arduplane.bin
          retention-days: 30

  # ── Job 2: Build SITL + run all 3 integration tests ──────────────────────
  sitl-tests:
    name: SITL Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ make
          pip install empy==3.3.4 pymavlink

      - name: Configure waf for SITL
        run: python3 waf configure --board sitl

      - name: Build ArduPlane SITL
        run: python3 waf --targets bin/arduplane

      - name: Test 1 — Fix #2 catapult standby (calm day + 12.35° ramp angle)
        run: python3 tests/sitl_catapult_test.py --binary build/sitl/bin/arduplane
        timeout-minutes: 5

      - name: Test 2 — Fix #1 windy-day full scenario
        run: python3 tests/sitl_full_scenario_test.py --binary build/sitl/bin/arduplane
        timeout-minutes: 5

      - name: Test 3 — Integration (standby + launch + gusty flight)
        run: python3 tests/sitl_integration_test.py --binary build/sitl/bin/arduplane
        timeout-minutes: 5

      - name: Upload flight logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-logs-${{ github.sha }}
          path: |
            /tmp/sitl_catapult_test/logs/*.BIN
            /tmp/sitl_full_scenario_test/logs/*.BIN
            /tmp/sitl_integration_test/logs/*.BIN
          retention-days: 14
